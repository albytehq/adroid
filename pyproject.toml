[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adroid"
version = "0.1.0"
description = "Self-hosted, contract-governed runtime that gives AI agents a stable, audit-grade surface to observe, request, and act on Android devices."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "albifahriza", email = "289437483+albytehq@users.noreply.github.com" },
]
keywords = ["android", "ai", "agents", "mcp", "runtime", "audit", "automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "pydantic>=2.5,<3",
    "cryptography>=42,<46",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0,<2",
]
web = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
]
termux = []  # no extra deps; uses termux-api CLI via subprocess
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",  # for testing WebServer
]

[project.urls]
Homepage = "https://github.com/albytehq/adroid"
Repository = "https://github.com/albytehq/adroid"
Documentation = "https://github.com/albytehq/adroid/tree/main/docs"
Issues = "https://github.com/albytehq/adroid/issues"

[project.scripts]
adroid-start = "adroid.cli:main"
adroid-issue-token = "adroid.mcp.issue_token:main"
adroid-mcp-server = "adroid.mcp.server:main"
adroid-pair = "adroid.pair:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adroid*"]

[tool.setuptools.package-data]
"adroid.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
