[package]
name = "adroid_rust"
version = "0.3.6"
edition = "2021"
description = "Rust extensions for Adroid — fast uiautomator XML parser"

[lib]
name = "adroid_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
quick-xml = "0.36"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
