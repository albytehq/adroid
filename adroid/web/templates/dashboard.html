<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adroid · Pairing Dashboard</title>
  <style>
    :root {
      --bg: #0a0e14;
      --panel: #11161f;
      --panel-2: #1a2030;
      --border: #2a3245;
      --text: #e6edf3;
      --text-dim: #8b96a7;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      padding: 16px;
      min-height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header .meta {
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 12px;
    }
    .status-pill {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-pill.idle { background: var(--panel-2); color: var(--text-dim); }
    .status-pill.pairing { background: var(--yellow); color: var(--bg); }
    .status-pill.connected { background: var(--green); color: var(--bg); }
    .status-pill.disconnected { background: var(--red); color: var(--bg); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      height: calc(100vh - 100px);
    }
    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; height: auto; }
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-2);
    }
    .panel-header h2 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    /* Pairing card */
    .pairing-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--yellow);
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .pairing-card.highlighted {
      border-left-width: 5px;
      background: var(--panel);
      box-shadow: 0 0 0 2px var(--yellow);
    }
    .pairing-card .agent {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .pairing-card .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-family: var(--mono);
      font-size: 12px;
    }
    .pairing-card .label { color: var(--text-dim); }
    .pairing-card .value { color: var(--text); }
    .pairing-card .ttl-selector {
      margin: 12px 0;
      padding: 10px;
      background: var(--bg);
      border-radius: 4px;
    }
    .pairing-card .ttl-selector label {
      display: block;
      color: var(--text-dim);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .pairing-card .ttl-options {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .pairing-card .ttl-option {
      padding: 5px 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: var(--mono);
    }
    .pairing-card .ttl-option.selected {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .pairing-card .ttl-custom {
      width: 100%;
      padding: 5px 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 12px;
    }
    .pairing-card .buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn {
      flex: 1;
      padding: 9px 14px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .btn:hover { background: var(--panel-2); }
    .btn.approve {
      background: var(--green);
      color: var(--bg);
      border-color: var(--green);
      font-weight: 600;
    }
    .btn.approve:hover { opacity: 0.9; }
    .btn.deny {
      background: transparent;
      color: var(--red);
      border-color: var(--red);
    }
    .btn.deny:hover { background: var(--red); color: var(--bg); }
    .btn.disconnect {
      background: var(--red);
      color: var(--bg);
      border-color: var(--red);
      font-weight: 600;
    }

    /* Session card */
    .session-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--green);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .session-card .agent { color: var(--green); font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .session-card .countdown { color: var(--yellow); font-family: var(--mono); font-size: 12px; }

    /* Terminal */
    .terminal {
      background: var(--bg);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
    }
    .terminal-line {
      padding: 2px 0;
      display: flex;
      gap: 8px;
      border-bottom: 1px dotted rgba(255,255,255,0.04);
    }
    .terminal-line .ts { color: var(--text-dim); flex-shrink: 0; min-width: 90px; }
    .terminal-line .kind {
      width: 70px;
      flex-shrink: 0;
      font-weight: 600;
    }
    .terminal-line .kind.request { color: var(--accent); }
    .terminal-line .kind.result { color: var(--green); }
    .terminal-line .kind.error { color: var(--red); }
    .terminal-line .kind.system { color: var(--text-dim); }
    .terminal-line .kind.pairing { color: var(--yellow); }
    .terminal-line .kind.session { color: #bf63ff; }
    .terminal-line .text { flex: 1; word-break: break-all; }

    .empty {
      color: var(--text-dim);
      text-align: center;
      padding: 24px;
      font-style: italic;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
      margin-right: 6px;
    }
    .status-dot.disconnected { background: var(--red); }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔒 Adroid Pairing Dashboard</h1>
    <div class="meta">
      <span id="ws-status"><span class="status-dot"></span>connected</span>
      · issuer=<code>{{ issuer_id }}</code>
      · session=<code>{{ session_id }}</code>
      · <span id="status-pill" class="status-pill idle">idle</span>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="panel-header">
        <h2>Pairing Requests & Active Sessions</h2>
        <span id="counts" class="meta" style="color: var(--text-dim); font-family: var(--mono); font-size: 12px;"></span>
      </div>
      <div class="panel-body" id="left-panel">
        <div class="empty">Waiting for AI agent to request pairing…</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Agent Terminal</h2>
        <span id="terminal-count" class="meta" style="color: var(--text-dim); font-family: var(--mono); font-size: 12px;">0 lines</span>
      </div>
      <div class="panel-body terminal" id="terminal">
        <div class="empty">No activity yet</div>
      </div>
    </div>
  </div>

  <script>
    const leftPanel = document.getElementById('left-panel');
    const terminal = document.getElementById('terminal');
    const terminalCount = document.getElementById('terminal-count');
    const wsStatus = document.getElementById('ws-status');
    const statusPill = document.getElementById('status-pill');
    const counts = document.getElementById('counts');
    let lineCount = 0;
    let selectedTtls = {};  // pairing_id → ttl_seconds

    function fmtTs(iso) {
      const d = new Date(iso);
      return d.toLocaleTimeString('en-US', { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
    }

    function fmtDuration(seconds) {
      if (seconds < 60) return seconds + 's';
      if (seconds < 3600) return Math.floor(seconds/60) + 'm';
      if (seconds < 86400) return Math.floor(seconds/3600) + 'h';
      return Math.floor(seconds/86400) + 'd';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    function renderState(state) {
      const pairings = state.pairings || [];
      const sessions = state.sessions || [];
      counts.textContent = `${pairings.length} pending · ${sessions.length} active`;

      // Update status pill
      if (sessions.length > 0) {
        statusPill.className = 'status-pill connected';
        statusPill.textContent = 'connected';
      } else if (pairings.length > 0) {
        statusPill.className = 'status-pill pairing';
        statusPill.textContent = 'pairing';
      } else {
        statusPill.className = 'status-pill idle';
        statusPill.textContent = 'idle';
      }

      // Check hash for highlighted pairing
      const hashId = (location.hash || '').replace('#pairing-', '');

      let html = '';
      if (pairings.length === 0 && sessions.length === 0) {
        html = '<div class="empty">Waiting for AI agent to request pairing…</div>';
      }

      // Render pending pairings first
      pairings.forEach(p => {
        const highlighted = p.pairing_id === hashId ? 'highlighted' : '';
        const selectedTtl = selectedTtls[p.pairing_id] || 3600;  // default 1h
        html += `
          <div class="pairing-card ${highlighted}" id="pairing-${p.pairing_id}">
            <div class="agent">🤖 ${escapeHtml(p.agent_id)}</div>
            <div class="row"><span class="label">pairing_id</span><span class="value">${p.pairing_id.slice(0,8)}…</span></div>
            <div class="row"><span class="label">requested</span><span class="value">${fmtTs(p.requested_at)}</span></div>
            <div class="ttl-selector">
              <label>Session duration (TTL):</label>
              <div class="ttl-options">
                ${[60, 300, 3600, 21600, 86400, 604800].map(s => `
                  <button class="ttl-option ${selectedTtl === s ? 'selected' : ''}"
                          onclick="selectTtl('${p.pairing_id}', ${s})">${fmtDuration(s)}</button>
                `).join('')}
              </div>
              <input type="number" class="ttl-custom" placeholder="custom (seconds, min 60)"
                     onchange="selectTtlCustom('${p.pairing_id}', this.value)"
                     value="${selectedTtl !== 60 && selectedTtl !== 300 && selectedTtl !== 3600 && selectedTtl !== 21600 && selectedTtl !== 86400 && selectedTtl !== 604800 ? selectedTtl : ''}" />
            </div>
            <div class="buttons">
              <button class="btn approve" onclick="approvePairing('${p.pairing_id}')">Approve & Connect</button>
              <button class="btn deny" onclick="denyPairing('${p.pairing_id}')">Deny</button>
            </div>
          </div>
        `;
      });

      // Render active sessions
      sessions.forEach(s => {
        const remaining = s.remaining_seconds || 0;
        html += `
          <div class="session-card">
            <div class="agent">🟢 ${escapeHtml(s.agent_id)}</div>
            <div class="row"><span class="label">session</span><span class="value">${s.session_id.slice(0,8)}…</span></div>
            <div class="row"><span class="label">created</span><span class="value">${fmtTs(s.created_at)}</span></div>
            <div class="row"><span class="label">expires</span><span class="value">${fmtTs(s.expires_at)}</span></div>
            <div class="row"><span class="label">remaining</span><span class="value countdown">${fmtDuration(remaining)}</span></div>
            <div class="buttons">
              <button class="btn disconnect" onclick="disconnectSession('${s.session_id}')">Disconnect</button>
            </div>
          </div>
        `;
      });

      leftPanel.innerHTML = html;

      // Scroll highlighted pairing into view
      if (hashId) {
        const el = document.getElementById('pairing-' + hashId);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function selectTtl(pairingId, ttl) {
      selectedTtls[pairingId] = ttl;
      // Re-render just this card's options
      const card = document.getElementById('pairing-' + pairingId);
      if (card) {
        card.querySelectorAll('.ttl-option').forEach(btn => {
          btn.classList.toggle('selected', parseInt(btn.getAttribute('onclick').match(/\d+/)[0]) === ttl);
        });
        card.querySelector('.ttl-custom').value = '';
      }
    }

    function selectTtlCustom(pairingId, val) {
      const n = parseInt(val);
      if (n >= 60) {
        selectedTtls[pairingId] = n;
        const card = document.getElementById('pairing-' + pairingId);
        if (card) {
          card.querySelectorAll('.ttl-option').forEach(btn => btn.classList.remove('selected'));
        }
      }
    }

    async function approvePairing(pairingId) {
      const ttl = selectedTtls[pairingId] || 3600;
      const res = await fetch(`/api/pair/${pairingId}/approve`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ ttl_seconds: ttl }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({detail: 'unknown'}));
        alert('Approve failed: ' + JSON.stringify(err.detail));
      }
    }

    async function denyPairing(pairingId) {
      await fetch(`/api/pair/${pairingId}/deny`, { method: 'POST' });
    }

    async function disconnectSession(sessionId) {
      if (!confirm('Disconnect this AI session? They will lose access immediately.')) return;
      await fetch(`/api/session/${sessionId}/disconnect`, { method: 'POST' });
    }

    function appendTerminal(line) {
      lineCount++;
      terminalCount.textContent = lineCount + ' lines';
      const empty = terminal.querySelector('.empty');
      if (empty) empty.remove();

      const div = document.createElement('div');
      div.className = 'terminal-line';
      div.innerHTML = `
        <span class="ts">${fmtTs(line.ts)}</span>
        <span class="kind ${line.kind}">${line.kind}</span>
        <span class="text">${escapeHtml(line.text)}</span>
      `;
      terminal.appendChild(div);
      while (terminal.children.length > 500) {
        terminal.removeChild(terminal.firstChild);
      }
      terminal.scrollTop = terminal.scrollHeight;
    }

    // WebSocket
    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => {
        wsStatus.innerHTML = '<span class="status-dot"></span>connected';
      };
      ws.onclose = () => {
        wsStatus.innerHTML = '<span class="status-dot disconnected"></span>disconnected';
        setTimeout(connect, 1000);
      };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'init') {
          renderState(msg.state);
          (msg.state.terminal || []).forEach(appendTerminal);
        } else if (msg.type === 'terminal') {
          appendTerminal(msg.line);
        } else if (msg.type === 'state') {
          renderState(msg.state);
        }
      };
    }
    connect();

    // Fallback polling
    setInterval(async () => {
      try {
        const res = await fetch('/api/state');
        const state = await res.json();
        renderState(state);
      } catch (e) {}
    }, 2000);

    // Hash change
    window.addEventListener('hashchange', async () => {
      const res = await fetch('/api/state');
      const state = await res.json();
      renderState(state);
    });
  </script>
</body>
</html>
